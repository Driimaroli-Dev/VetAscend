<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recepção - VetAscend</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="tela-recepcao">

        <!--Todas as informações da Barra superior-->
        <div id="barra-superior"></div>

        <!--Painel da Agenda-->
        <section class="painel-agenda">
            <p class="titulo-agenda">Agenda</p>
            <p class="resumo-agenda">Acompanhe os atendimentos do dia</p>
            <button class="botao-abrir-agenda" 
        type="button">Abrir Agenda</button>
        </section>

        <!--Cecília-->
        <section class="area-cecilia">
            <div class="fala-cecilia">
                <div class="avatar-cecilia"></div>

                    <div class="balao-cecilia">
                        <p class="texto-cecilia">Oii! Que bom ter você por aqui!</p>
                    <div class="opcoes-cecilia">
                        <button class="botao-conhecer">Quero Conhecer</button>
                        <button class="botao-explorar">Explorar sozinha</button>
                    </div>
                    <button class="botao-continuar">Continuar</button>
                    </div>
            </div>

        </section>  

    </main>
    <script src="componentes.js"></script>
    <script src="recepcao.js"></script>
</body>
</html>
