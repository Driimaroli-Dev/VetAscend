<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VetAscend</title> 
    <link rel="stylesheet" href="style.css"> <!-- Conecta o style.css ao html-->
</head>
<body>
    <main class="tela-login">
        <section class="card-login">
            <h1>Bem-vinda!</h1>
            <p>Seu espaço para aprender, praticar e evoluir.</p>
            <input class="campo-email" type="E-mail"
            placeholder="E-mail">  <!--Campo onde o usuario digita o email-->
        <div class="area-senha">
            <input class="campo-senha" type="password"
            placeholder="Senha">
            <button class="botao-mostrar-senha" type="button"> 👀 </button>
        </div>
            <p class="mensagem-erro"></p>  <!-- lugar onde o javascript mostrará o erro-->
            <button class="botao-entrar">Entrar</button>
            <a href="#">Esqueci minha Senha</a>  <!-- Cria um link clicavel e define para onde vai-->
            <button class="botao-criar-conta">Criar conta</button>
        </section>      
    </main>
    <script src="script.js"></script>  <!-- Conecta o javascript ao html-->
</body>
</html>
