<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title> Preview Mobile - VetAscend</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #202124;
        }

        .celular {
            width: 390px;
            height: 844px;
            border: 10px solid #111;
            border-radius: 38px;
            overflow: hidden;
            background-color: #111;
            transform: scale(1);
        }

        .celular iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>

    <div class="celular">
        <iframe src="recepcao.html"></iframe>
    </div>
</body>
</html>
